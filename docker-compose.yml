# 12Factor App - X. Dev/prod parity
version: '3.8'

services:
  next-auth-app:
    build:
      context: .
      dockerfile: Dockerfile
    # 12Factor App - VII. Port binding
    ports:
      - "3000:3000"
    # 12Factor App - III. Config: Environment variables
    environment:
      - NODE_ENV=production
      - PORT=3000
      - AUTH0_CLIENT_ID=${AUTH0_CLIENT_ID}
      - AUTH0_CLIENT_SECRET=${AUTH0_CLIENT_SECRET}
      - AUTH0_ISSUER=${AUTH0_ISSUER}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXTAUTH_URL=${NEXTAUTH_URL}
    # 12Factor App - II. Dependencies: Explicit dependency isolation
    volumes:
      - app_data:/app/data
    # 12Factor App - VIII. Concurrency: Process scaling
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    # Health check - 12Factor App monitoring
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

volumes:
  app_data:
    driver: local 